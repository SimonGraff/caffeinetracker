<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0f14;--card:#12161e;--border:#1a1f2a;--text:#d0d6de;
  --dim:#5a6270;--muted:#3a4250;--accent:#8090a0;
  --ok:#2d6b45;--ok-light:#6bc98a;--warn:#8b7a3a;--warn-light:#d4a843;

}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,16px) + 8px) 16px 120px;min-height:100dvh;position:relative}
.toast{position:fixed;top:env(safe-area-inset-top,16px);left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;border:1px solid;font-size:12px;font-weight:600;z-index:999;max-width:340px;text-align:center;animation:slideD .25s;font-family:var(--font)}
.toast-ok{background:#1a3a2a;border-color:var(--ok);color:var(--ok-light)}
.toast-warn{background:#3a3020;border-color:var(--warn);color:var(--warn-light)}
.toast-danger{background:#3a1a1a;border-color:var(--danger);color:var(--danger-light)}
.toast-info{background:#1a2a3a;border-color:#3a5a8b;color:#7aafdf}
@keyframes slideD{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hdr{margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:14px}
.hdr-top{display:flex;align-items:baseline;gap:8px}
.hdr h1{font-size:24px;font-weight:800;color:#e8ecf0;letter-spacing:2px}

.hdr-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.hdr .clk{font-size:16px;color:var(--accent);font-weight:300}
.pill{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.pill-ok{background:var(--ok)}.pill-warn{background:var(--warn)}.pill-stop{background:var(--danger)}
.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:12px}
.lbl{font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.val{font-size:32px;font-weight:800;line-height:1.1}
.val-sm{font-size:24px;font-weight:800;line-height:1.1}
.bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.bar-f{height:100%;border-radius:2px;transition:width .4s}
.sleep-box{margin-top:8px;padding:6px 8px;border-radius:6px;text-align:center;font-weight:600;font-size:11px}
.sleep-box.ok{color:var(--ok-light);background:rgba(45,107,69,.15)}
.sleep-box.warn{color:var(--warn-light);background:rgba(139,122,58,.15)}
.sleep-box.danger{color:var(--danger-light);background:rgba(139,58,58,.15)}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,20px) + 28px);left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;border:none;border-radius:50px;padding:14px 28px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(45,107,69,.4);z-index:50;display:flex;align-items:center;gap:8px;letter-spacing:1px;transition:all .15s}

.fab .plus{font-size:20px;font-weight:300}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .15s}
.panel{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px env(safe-area-inset-bottom,20px);max-height:85dvh;overflow-y:auto}
.panel-title{font-size:14px;font-weight:700;color:#e8ecf0;margin-bottom:4px}
.panel-sub{font-size:10px;color:var(--dim);margin-bottom:14px}

.size-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn-cancel{background:var(--bg);color:var(--dim);border:1px solid var(--border)}

.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-nav button{background:none;border:none;color:var(--dim);font-family:var(--font);font-size:16px;cursor:pointer;padding:4px 8px}
.cal-nav .cal-month{font-size:13px;font-weight:600;color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.cal-hdr{font-size:9px;color:var(--muted);text-align:center;padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;background:var(--card);border:1px solid transparent}
.cal-day.empty{background:transparent}
.cal-day.today{border-color:var(--accent)}
.cal-day .cd-num{font-weight:600;color:var(--dim)}
.cal-day .cd-mg{font-size:8px;font-weight:700;margin-top:1px}
.cal-day .cd-dot{width:4px;height:4px;border-radius:50%;margin-top:2px}
.h-day{padding:10px 0;border-bottom:1px solid var(--border)}
.h-hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.h-date{font-size:12px;font-weight:600;color:var(--accent)}
.h-total{font-size:12px;font-weight:700}
.h-late{font-size:9px;color:var(--late)}
.h-chips{display:flex;flex-wrap:wrap;gap:4px}
.h-chip{font-size:10px;background:var(--card);padding:2px 6px;border-radius:4px;color:var(--dim)}
.prog-card{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border);margin-bottom:8px}
.prog-row{display:flex;justify-content:space-between;align-items:center}
.prog-label{font-size:11px;color:var(--dim)}
.prog-val{font-size:16px;font-weight:700}
.prog-delta{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.prog-delta.good{color:var(--ok-light);background:rgba(45,107,69,.15)}
.prog-delta.bad{color:var(--danger-light);background:rgba(139,58,58,.15)}
.prog-delta.flat{color:var(--dim);background:rgba(90,98,112,.1)}
.streak{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.streak-badge{font-size:10px;padding:4px 10px;border-radius:8px;font-weight:600;background:rgba(45,107,69,.12);color:var(--ok-light);border:1px solid rgba(45,107,69,.25)}
.bar-chart{display:flex;gap:4px;height:100px;align-items:flex-end;margin-bottom:6px}
.bc-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bc-val{font-size:8px;color:var(--dim);margin-bottom:3px;height:12px}
.bc-track{flex:1;width:100%;background:var(--card);border-radius:4px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.bc-fill{width:100%;transition:height .3s}
.bc-late{position:absolute;left:0;right:0}
.bc-lbl{font-size:9px;color:var(--muted);margin-top:3px}
.legend{display:flex;gap:12px;justify-content:center;margin:8px 0 14px}
.leg-i{font-size:9px;color:var(--dim);display:flex;align-items:center;gap:3px}
.leg-dot{width:7px;height:7px;border-radius:2px;display:inline-block}
.info-box{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--border)}
.info-t{font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.info-r{font-size:11px;color:var(--accent);margin-bottom:5px;line-height:1.4}
.ftr{text-align:center;padding:20px 0}
.ftr button{background:none;border:1px solid #2a1a1a;color:#5a3a3a;padding:6px 14px;border-radius:6px;font-size:10px;cursor:pointer;font-family:var(--font)}
.g-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sleep-card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:14px}
.sleep-card .sc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sleep-card .sc-title{font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
.sleep-card .sc-score{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.sleep-card .sc-row{display:flex;gap:12px;flex-wrap:wrap}
.sleep-card .sc-stat{flex:1;min-width:60px}
.sleep-card .sc-label{font-size:9px;color:var(--muted);margin-bottom:2px}
.sleep-card .sc-val{font-size:14px;font-weight:700}
.sleep-card .sc-stages{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;gap:1px}
.sleep-card .sc-stage{height:100%}
.sleep-card .sc-legend{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.sleep-card .sc-leg{font-size:8px;color:var(--dim);display:flex;align-items:center;gap:2px}
.sleep-card .sc-ldot{width:6px;height:6px;border-radius:2px;display:inline-block}
.sleep-card .sc-err{font-size:10px;color:var(--muted);text-align:center;padding:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CATEGORIES=[
  {id:"kaffee",label:"Kaffee",items:[
    {id:"kaffee-schwarz",name:"Schwarzer Kaffee",emoji:"☕",sizes:[{label:"Kleine Tasse",ml:150,mg:60},{label:"Becher",ml:250,mg:95},{label:"Großer Becher",ml:350,mg:135}]},
    {id:"espresso",name:"Espresso",emoji:"☕",sizes:[{label:"Single Shot",ml:30,mg:63},{label:"Doppio",ml:60,mg:126}]},
    {id:"cappuccino",name:"Cappuccino",emoji:"☕",sizes:[{label:"Standard",ml:200,mg:63},{label:"Groß",ml:350,mg:126}]},
    {id:"latte",name:"Latte / Flat White",emoji:"☕",sizes:[{label:"Standard",ml:300,mg:63},{label:"Groß",ml:450,mg:126}]},
  ]},
  {id:"mate",label:"Mate",items:[
    {id:"clubmate",name:"Club-Mate",emoji:"🧉",sizes:[{label:"Flasche",ml:500,mg:100},{label:"Halbe",ml:250,mg:50}]},
    {id:"matetee",name:"Mate Tee",emoji:"🍵",sizes:[{label:"Kalebasse",ml:300,mg:78},{label:"Kleine",ml:150,mg:39}]},
  ]},
  {id:"tee",label:"Tee",items:[
    {id:"gruentee",name:"Grüner Tee",emoji:"🍃",sizes:[{label:"Tasse",ml:200,mg:35},{label:"Kanne",ml:400,mg:70}]},
    {id:"matcha",name:"Matcha Latte",emoji:"🍵",sizes:[{label:"Standard",ml:250,mg:70},{label:"Groß",ml:400,mg:105}]},
    {id:"chai",name:"Chai Latte",emoji:"🫖",sizes:[{label:"Tasse",ml:250,mg:50},{label:"Groß",ml:400,mg:75}]},
    {id:"schwarztee",name:"Schwarzer Tee",emoji:"🫖",sizes:[{label:"Tasse",ml:200,mg:47},{label:"Becher",ml:350,mg:70}]},
  ]},
  {id:"soft",label:"Softdrinks",items:[
    {id:"cola",name:"Cola",emoji:"🥤",sizes:[{label:"Dose",ml:330,mg:32},{label:"Flasche",ml:500,mg:48}]},
    {id:"cola-zero",name:"Cola Zero",emoji:"🥤",sizes:[{label:"Dose",ml:330,mg:32},{label:"Flasche",ml:500,mg:48}]},
    {id:"energy",name:"Energy Drink",emoji:"⚡",sizes:[{label:"Dose",ml:250,mg:80},{label:"Große Dose",ml:500,mg:160}]},
  ]},
];
const ALL_DRINKS={};CATEGORIES.forEach(c=>c.items.forEach(d=>{ALL_DRINKS[d.id]=d}));
const DRINK_CUTOFFS={gruentee:14,matcha:14,chai:14,schwarztee:13};
function getCutoff(id){return DRINK_CUTOFFS[id]||12}
const SAFE=400,HARD=14,HLH=5,SLP=21,SLP_TGT=50,WAKE=7,SK="caffeine-log";

let log={},view="today",pickerStep=null,editingEntry=null,toastTO=null,calM=new Date().getMonth(),calY=new Date().getFullYear();

// Oura
const OURA_TOKEN="DM4E7QIVM7D5OVX7WNUMPIOIPXTUQ5KZ";
let sleepData=null,sleepLoading=false,sleepError=null;

async function fetchSleep(){
  if(sleepLoading)return;
  sleepLoading=true;sleepError=null;render();
  try{
    // Get yesterday and today for sleep range (last night's sleep)
    const today=new Date(),yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
    const startDate=yesterday.toISOString().split("T")[0];
    const endDate=today.toISOString().split("T")[0];
    const url=`https://api.ouraring.com/v2/usercollection/sleep?start_date=${startDate}&end_date=${endDate}`;
    const res=await fetch(url,{headers:{"Authorization":`Bearer ${OURA_TOKEN}`}});
    if(!res.ok)throw new Error(`API ${res.status}`);
    const data=await res.json();
    // Get the most recent sleep period (type "long_sleep")
    const sessions=data.data||[];
    const longSleep=sessions.filter(s=>s.type==="long_sleep").sort((a,b)=>b.bedtime_end?.localeCompare(a.bedtime_end))[0];
    if(longSleep){
      const bStart=new Date(longSleep.bedtime_start);
      const bEnd=new Date(longSleep.bedtime_end);
      const durMin=longSleep.time_in_bed?Math.round(longSleep.time_in_bed/60):Math.round((bEnd-bStart)/60000);
      const durH=Math.floor(durMin/60);const durM=durMin%60;
      // Sleep stages from contributors or readiness
      const deep=longSleep.deep_sleep_duration?Math.round(longSleep.deep_sleep_duration/60):null;
      const rem=longSleep.rem_sleep_duration?Math.round(longSleep.rem_sleep_duration/60):null;
      const light=longSleep.light_sleep_duration?Math.round(longSleep.light_sleep_duration/60):null;
      const awake=longSleep.awake_time?Math.round(longSleep.awake_time/60):null;
      const totalSleep=longSleep.total_sleep_duration?Math.round(longSleep.total_sleep_duration/60):durMin;
      const efficiency=longSleep.efficiency||null;
      const score=longSleep.readiness?.score||null;
      // Heart rate
      const hrAvg=longSleep.average_heart_rate||null;
      const hrv=longSleep.average_hrv||null;
      sleepData={
        bedStart:bStart,bedEnd:bEnd,durH,durM,durMin,totalSleep,
        deep,rem,light,awake,efficiency,score,hrAvg,hrv,
        raw:longSleep
      };
    } else {
      sleepData=null;sleepError="Keine Schlafdaten gefunden";
    }
  }catch(err){
    sleepError=err.message;sleepData=null;
  }
  sleepLoading=false;render();
}


const $=s=>document.querySelector(s);
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const tk=()=>dk(new Date());
const gH=iso=>new Date(iso).getHours();
const fT=iso=>new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const fD=iso=>new Date(iso).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
function load(){try{const d=localStorage.getItem(SK);if(d)log=JSON.parse(d)}catch{}}
function save(){try{localStorage.setItem(SK,JSON.stringify(log))}catch{}}
function eB(entries,at=null){const t=at?new Date(at).getTime():Date.now();let r=0;entries.forEach(e=>{const h=(t-new Date(e.time).getTime())/36e5;if(h>=0&&h<48)r+=e.mg*Math.pow(.5,h/HLH)});return Math.round(r)}
function btE(entries){const d=new Date(),b=new Date(d.getFullYear(),d.getMonth(),d.getDate(),SLP,0,0);if(b.getTime()<Date.now())b.setDate(b.getDate()+1);return eB(entries,b.toISOString())}
function recBt(entries){const n=Date.now();if(eB(entries)<=SLP_TGT)return null;for(let m=15;m<=960;m+=15){const t=new Date(n+m*6e4);if(eB(entries,t.toISOString())<=SLP_TGT){const rm=Math.ceil(t.getMinutes()/15)*15;if(rm>=60){t.setHours(t.getHours()+1);t.setMinutes(0)}else t.setMinutes(rm,0,0);return t}}return null}
function isSleep(){const h=new Date().getHours();return h>=SLP||h<WAKE}
function allE(){return Object.values(log).flat()}
function dT(k){return(log[k]||[]).reduce((s,e)=>s+e.mg,0)}
function toast(msg,type="info"){const o=$(".toast");if(o)o.remove();if(toastTO)clearTimeout(toastTO);const el=document.createElement("div");el.className=`toast toast-${type}`;el.textContent=msg;document.body.appendChild(el);toastTO=setTimeout(()=>el.remove(),3000)}

function wkAvg(ago){let t=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-ago*7-i);t+=dT(dk(d))}return Math.round(t/7)}
function getStreaks(){const st=[];
let s1=0;for(let i=0;i<60;i++){const d=new Date();d.setDate(d.getDate()-i);const t=dT(dk(d));if(t<=300&&t>0)s1++;else if(i>0)break}
if(s1>1)st.push({l:`${s1} Tage unter 300mg`,i:"📉"});
let s2=0;for(let i=0;i<60;i++){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d),en=log[k]||[];const late=en.some(e=>gH(e.time)>=getCutoff(e.drinkId));if(!late&&en.length>0)s2++;else if(i>0)break}
if(s2>1)st.push({l:`${s2} Tage kein Spät-Koffein`,i:"🌙"});
let s3=0;for(let i=0;i<60;i++){const d=new Date();d.setDate(d.getDate()-i);const t=dT(dk(d));if(t<=SAFE&&t>0)s3++;else if(i>0)break}
if(s3>1)st.push({l:`${s3} Tage unter ${SAFE}mg`,i:"✅"});
return st}

function openPicker(){pickerStep="drink";render()}
function closePicker(){pickerStep=null;render()}
function selDrink(d){pickerStep={drink:d};render()}
function logDrink(dr,sz){
  const key=tk(),hour=new Date().getHours();
  const entry={id:Date.now(),drinkId:dr.id,mg:sz.mg,ml:sz.ml,sizeLabel:sz.label,time:new Date().toISOString()};
  if(!log[key])log[key]=[];log[key].push(entry);
  const total=log[key].reduce((s,e)=>s+e.mg,0),ae=allE(),bm=btE(ae),co=getCutoff(dr.id);
  let w=null,wt="warn";
  if(hour>=HARD){w=`🛑 Nach ${HARD} Uhr — Stopp!`;wt="danger"}
  else if(hour>=co){w=`⚠️ ${dr.name} nur bis ${co} Uhr`;wt="warn"}
  if(total>SAFE){w=`🚨 ${total}mg — Tageslimit!`;wt="danger"}
  else if(!w&&bm>SLP_TGT){w=`😴 ~${bm}mg um ${SLP} Uhr`;wt="warn"}
  pickerStep=null;save();render();
  toast(w||`+${sz.mg}mg ${dr.name} (${sz.label})`,w?wt:"ok")
}
function rmEntry(d,eid){if(!log[d])return;log[d]=log[d].filter(e=>e.id!==eid);if(!log[d].length)delete log[d];save();render();toast("Gelöscht","info")}
function openEdit(d,eid){const e=(log[d]||[]).find(x=>x.id===eid);if(!e)return;const t=new Date(e.time);editingEntry={dk:d,eid,hh:String(t.getHours()).padStart(2,"0"),mm:String(t.getMinutes()).padStart(2,"0")};render()}
function saveEdit(){if(!editingEntry)return;const{dk:d,eid,hh,mm}=editingEntry;const e=(log[d]||[]).find(x=>x.id===eid);if(!e)return;const t=new Date(e.time);t.setHours(parseInt(hh)||0,parseInt(mm)||0);e.time=t.toISOString();editingEntry=null;save();render();toast("Korrigiert","info")}
function resetAll(){if(!confirm("Alle Daten löschen?"))return;log={};save();render();toast("Zurückgesetzt","info")}

function render(){
  const now=new Date(),ch=now.getHours(),today=tk(),tE=log[today]||[],tT=tE.reduce((s,e)=>s+e.mg,0);
  const ae=allE(),blood=eB(ae),sleeping=isSleep(),btL=sleeping?blood:btE(ae),rb=recBt(ae);

  let pc,pt;
  if(sleeping){pc=blood>SLP_TGT?"pill-stop":"pill-ok";pt=blood>SLP_TGT?`🛏 ${blood}mg aktiv`:"😴 Schlafbereit"}
  else if(ch>=HARD){pc="pill-stop";pt="🛑 STOPP"}
  else if(ch>=12){pc="pill-warn";pt="🍃 NUR GRÜNTEE"}
  else{pc="pill-ok";pt="✅ OK"}

  let sh="";
  if(sleeping){sh=blood>SLP_TGT?`<div class="sleep-box danger">⚠️ ${blood}mg im Blut${rb?` — &lt;${SLP_TGT}mg ab ${rb.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}`:""}</div>`:`<div class="sleep-box ok">✅ Koffein abgebaut</div>`}
  else if(rb){const late=rb.getHours()>=SLP+1||(rb.getHours()<WAKE);sh=`<div class="sleep-box ${late?'danger':'warn'}">🛏 Schlafbereit ab ${rb.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr${late?' ⚠️':''}</div>`}
  else{sh=`<div class="sleep-box ok">🛏 Jetzt schlafbereit</div>`}

  let h=`<header class="hdr"><div class="hdr-top"><h1>CAFFEINE</h1><span class="sub">COMPANION</span></div>
    <div class="hdr-row"><span class="clk">${now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</span><span class="pill ${pc}">${pt}</span></div></header>
    <div class="g-row"><div class="card">
      <div class="lbl">Heute</div>
      <div class="val" style="color:${tT>SAFE?'var(--danger-light)':tT>300?'var(--warn-light)':'var(--ok-light)'}">${tT}<span style="font-size:14px;color:var(--dim)">mg</span></div>
      <div class="bar"><div class="bar-f" style="width:${Math.min(100,tT/SAFE*100)}%;background:${tT>SAFE?'var(--danger-light)':tT>300?'var(--warn-light)':'var(--ok-light)'}"></div></div>
    </div><div class="card">
      <div class="lbl">${sleeping?'Im Blut':'Im Blut jetzt'}</div>
      <div class="val-sm" style="color:${blood>150?'var(--warn-light)':'var(--ok-light)'}">${blood}<span style="font-size:14px;color:var(--dim)">mg</span></div>
      ${!sleeping?`<div class="lbl" style="margin-top:8px">Um ${SLP} Uhr</div><div class="val-sm" style="color:${btL>SLP_TGT?'var(--danger-light)':'var(--ok-light)'}">${btL}<span style="font-size:14px;color:var(--dim)">mg</span></div>`:''}
      ${sh}
    </div></div>
    <div class="tabs">
      <button class="tab${view==="today"?" on":""}" onclick="view='today';render()">Heute</button>
      <button class="tab${view==="log"?" on":""}" onclick="view='log';render()">Log</button>
      <button class="tab${view==="stats"?" on":""}" onclick="view='stats';render()">Stats</button>
    </div>`;

  if(view==="today"){
    // Oura Sleep Card
    if(sleepLoading){
      h+=`<div class="sleep-card"><div class="sc-err">🔄 Schlafdaten laden…</div></div>`;
    } else if(sleepData){
      const sd=sleepData;
      const fmtT=d=>d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
      const scoreColor=sd.efficiency>=85?"var(--ok-light)":sd.efficiency>=70?"var(--warn-light)":"var(--danger-light)";
      const totalH=Math.floor(sd.totalSleep/60),totalM=sd.totalSleep%60;
      h+=`<div class="sleep-card"><div class="sc-hdr"><span class="sc-title">😴 Letzte Nacht</span>`;
      if(sd.efficiency!=null)h+=`<span class="sc-score" style="color:${scoreColor};background:${sd.efficiency>=85?'rgba(45,107,69,.15)':sd.efficiency>=70?'rgba(139,122,58,.15)':'rgba(139,58,58,.15)'}">${sd.efficiency}% Effizienz</span>`;
      h+=`</div><div class="sc-row">
        <div class="sc-stat"><div class="sc-label">Schlaf</div><div class="sc-val" style="color:${totalH>=7?'var(--ok-light)':totalH>=6?'var(--warn-light)':'var(--danger-light)'}">${totalH}h ${totalM}m</div></div>
        <div class="sc-stat"><div class="sc-label">Bett</div><div class="sc-val">${fmtT(sd.bedStart)}</div></div>
        <div class="sc-stat"><div class="sc-label">Aufgestanden</div><div class="sc-val">${fmtT(sd.bedEnd)}</div></div>`;
      if(sd.hrAvg!=null)h+=`<div class="sc-stat"><div class="sc-label">Ø HR</div><div class="sc-val">${sd.hrAvg}</div></div>`;
      if(sd.hrv!=null)h+=`<div class="sc-stat"><div class="sc-label">Ø HRV</div><div class="sc-val">${Math.round(sd.hrv)}</div></div>`;
      h+=`</div>`;
      // Sleep stages bar
      if(sd.deep!=null&&sd.rem!=null&&sd.light!=null){
        const tot=sd.deep+sd.rem+sd.light+(sd.awake||0);
        if(tot>0){
          const pD=(sd.deep/tot*100).toFixed(0),pR=(sd.rem/tot*100).toFixed(0),pL=(sd.light/tot*100).toFixed(0),pA=((sd.awake||0)/tot*100).toFixed(0);
          h+=`<div class="sc-stages">
            <div class="sc-stage" style="width:${pD}%;background:#3a6baa"></div>
            <div class="sc-stage" style="width:${pR}%;background:#7a5aaa"></div>
            <div class="sc-stage" style="width:${pL}%;background:#5a8a6a"></div>
            ${sd.awake?`<div class="sc-stage" style="width:${pA}%;background:#5a4a3a"></div>`:''}
          </div>
          <div class="sc-legend">
            <span class="sc-leg"><span class="sc-ldot" style="background:#3a6baa"></span>Tief ${sd.deep}m</span>
            <span class="sc-leg"><span class="sc-ldot" style="background:#7a5aaa"></span>REM ${sd.rem}m</span>
            <span class="sc-leg"><span class="sc-ldot" style="background:#5a8a6a"></span>Leicht ${sd.light}m</span>
            ${sd.awake?`<span class="sc-leg"><span class="sc-ldot" style="background:#5a4a3a"></span>Wach ${sd.awake}m</span>`:''}
          </div>`;
        }
      }
      h+=`</div>`;
    } else if(sleepError){
      h+=`<div class="sleep-card"><div class="sc-err">⚠️ ${sleepError}</div></div>`;
    }

    if(!tE.length){h+=`<div class="empty">Noch kein Koffein heute 💪</div>`}
    else{h+=`<div class="tl">`;[...tE].reverse().forEach(e=>{
      const dr=ALL_DRINKS[e.drinkId],hr=gH(e.time),co=getCutoff(e.drinkId),late=hr>=co;
      h+=`<div class="tl-i${late?' late':''}"><div class="tl-r">
        <span class="tl-t" onclick="openEdit('${today}',${e.id})">${fT(e.time)}</span>
        <span class="tl-d">${dr?.emoji||"☕"} ${dr?.name||e.drinkId}</span>
        <span class="tl-sz">${e.sizeLabel||""}</span>
        <span class="tl-mg">${e.mg}mg</span>
        <button class="tl-x" onclick="rmEntry('${today}',${e.id})">✕</button>
      </div>${late?`<div class="tl-late">nach ${co} Uhr</div>`:""}</div>`});h+=`</div>`}
  }

  if(view==="log"){
    const cd=new Date(calY,calM,1),mn=cd.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
    const fd=(cd.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate(),ts=tk();
    h+=`<div class="cal-nav"><button onclick="calM--;if(calM<0){calM=11;calY--}render()">‹</button><span class="cal-month">${mn}</span><button onclick="calM++;if(calM>11){calM=0;calY++}render()">›</button></div><div class="cal-grid">
      <div class="cal-hdr">Mo</div><div class="cal-hdr">Di</div><div class="cal-hdr">Mi</div><div class="cal-hdr">Do</div><div class="cal-hdr">Fr</div><div class="cal-hdr">Sa</div><div class="cal-hdr">So</div>`;
    for(let i=0;i<fd;i++)h+=`<div class="cal-day empty"></div>`;
    for(let d=1;d<=dim;d++){
      const k=`${calY}-${String(calM+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,t=dT(k),it=dk===ts;
      const en=log[k]||[],hl=en.some(e=>gH(e.time)>=getCutoff(e.drinkId));
      const dc=t===0?"transparent":t>SAFE?"var(--danger-light)":hl?"var(--warn-light)":"var(--ok-light)";
      const mc=t===0?"transparent":t>SAFE?"var(--danger-light)":t>300?"var(--warn-light)":"var(--ok-light)";
      h+=`<div class="cal-day${k===ts?' today':''}"><span class="cd-num">${d}</span>${t>0?`<span class="cd-mg" style="color:${mc}">${t}</span>`:""}<span class="cd-dot" style="background:${dc}"></span></div>`}
    h+=`</div>`;
    const keys=Object.keys(log).sort().reverse().filter(k=>{const[y,m]=k.split("-");return+y===calY&&+m===calM+1});
    if(keys.length){keys.forEach(d=>{const en=log[d],dt=en.reduce((s,e)=>s+e.mg,0),lt=en.filter(e=>gH(e.time)>=getCutoff(e.drinkId)).reduce((s,e)=>s+e.mg,0);
      h+=`<div class="h-day"><div class="h-hdr"><span class="h-date">${fD(en[0].time)}</span><span class="h-total" style="color:${dt>SAFE?'var(--danger-light)':'var(--accent)'}">${dt}mg</span>${lt>0?`<span class="h-late">(${lt}mg spät)</span>`:""}</div><div class="h-chips">${en.map(e=>{const dr=ALL_DRINKS[e.drinkId];return`<span class="h-chip">${dr?.emoji||"☕"} ${fT(e.time)} ${e.mg}mg</span>`}).join("")}</div></div>`})}
    else{h+=`<div class="empty">Keine Einträge</div>`}
  }

  if(view==="stats"){
    const tw=wkAvg(0),lw=wkAvg(1),delta=lw>0?Math.round(((tw-lw)/lw)*100):0;
    const dc=delta<-5?"good":delta>5?"bad":"flat",ds=delta>0?"+":"";
    const streaks=getStreaks();
    h+=`<div class="prog-card"><div class="prog-row"><div><div class="prog-label">Ø diese Woche</div><div class="prog-val" style="color:${tw>SAFE?'var(--danger-light)':tw>300?'var(--warn-light)':'var(--ok-light)'}">${tw}mg<span style="font-size:11px;color:var(--dim)">/Tag</span></div></div><div class="prog-delta ${dc}">${ds}${delta}% vs. letzte</div></div></div>`;
    if(streaks.length)h+=`<div class="streak">${streaks.map(s=>`<span class="streak-badge">${s.i} ${s.l}</span>`).join("")}</div>`;

    const l7=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d),en=log[k]||[],t=en.reduce((s,e)=>s+e.mg,0),ac=en.filter(e=>gH(e.time)>=getCutoff(e.drinkId)).reduce((s,e)=>s+e.mg,0);l7.push({k,d,t,ac})}
    const mx=Math.max(...l7.map(d=>d.t),1);
    h+=`<div class="lbl" style="margin-bottom:8px">LETZTE 7 TAGE</div><div class="bar-chart">${l7.map(d=>{
      const mH=((Math.max(0,d.t-d.ac))/mx)*100,lH=(d.ac/mx)*100,lB=((d.t-d.ac)/mx)*100;
      return`<div class="bc-col"><div class="bc-val">${d.t||""}</div><div class="bc-track">${d.ac>0?`<div class="bc-late" style="height:${lH}%;bottom:${lB}%;background:var(--late)"></div>`:""}<div class="bc-fill" style="height:${mH}%;background:${d.t>SAFE?'var(--danger-light)':'var(--ok)'}"></div></div><div class="bc-lbl">${d.d.toLocaleDateString("de-DE",{weekday:"short"}).slice(0,2)}</div></div>`}).join("")}</div>
    <div class="legend"><span class="leg-i"><span class="leg-dot" style="background:var(--ok)"></span> OK</span><span class="leg-i"><span class="leg-dot" style="background:var(--late)"></span> Spät</span><span class="leg-i"><span class="leg-dot" style="background:var(--danger-light)"></span> Limit</span></div>`;

    const w4=[];for(let i=3;i>=0;i--)w4.push(wkAvg(i));const w4m=Math.max(...w4,1);
    h+=`<div class="lbl" style="margin-bottom:8px">4 WOCHEN TREND</div><div class="bar-chart" style="height:80px">${w4.map((v,i)=>{
      const lb=i===3?"jetzt":`-${3-i}W`;return`<div class="bc-col"><div class="bc-val">${v}</div><div class="bc-track"><div class="bc-fill" style="height:${(v/w4m)*100}%;background:${v>SAFE?'var(--danger-light)':v>300?'var(--warn-light)':'var(--ok)'}"></div></div><div class="bc-lbl">${lb}</div></div>`}).join("")}</div>`;

    h+=`<div class="info-box" style="margin-top:14px"><div class="info-t">Regeln</div>
      <div class="info-r">→ Max. ${SAFE}mg / Tag</div><div class="info-r">→ Kaffee & Mate: bis 12 Uhr</div>
      <div class="info-r">→ Grüner/Schwarzer Tee & Chai: bis 13–14 Uhr</div><div class="info-r">→ Ab 14 Uhr: koffeinfrei</div>
      <div class="info-r">→ Ziel: &lt;${SLP_TGT}mg um ${SLP} Uhr</div><div class="info-r">→ Schlafenszeit: ${SLP}–22 Uhr</div></div>`
  }

  h+=`<div class="ftr"><button onclick="resetAll()">Daten zurücksetzen</button></div>`;
  if(!pickerStep)h+=`<button class="fab" onclick="openPicker()"><span class="plus">+</span> Getränk</button>`;
  $("#app").innerHTML=h;

  // Picker overlay
  let ex=document.getElementById("pk");if(ex)ex.remove();
  if(pickerStep){
    const ov=document.createElement("div");ov.id="pk";ov.className="overlay";
    ov.onclick=e=>{if(e.target===ov)closePicker()};
    if(pickerStep==="drink"){
      let p=`<div class="panel"><div class="panel-title">Getränk wählen</div><div class="panel-sub">Was trinkst du?</div>`;
      CATEGORIES.forEach(cat=>{p+=`<div class="cat-label">${cat.label}</div><div class="drink-list">`;
        cat.items.forEach(d=>{const mr=d.sizes.length>1?`${d.sizes[0].mg}–${d.sizes[d.sizes.length-1].mg}mg`:`${d.sizes[0].mg}mg`;
          p+=`<div class="drink-opt" onclick="selDrink(ALL_DRINKS['${d.id}'])"><span class="emo">${d.emoji}</span><div class="info"><div class="name">${d.name}</div><div class="meta">${mr}</div></div><span class="arrow">›</span></div>`});
        p+=`</div>`});
      p+=`</div>`;ov.innerHTML=p
    } else if(pickerStep.drink){
      const dr=pickerStep.drink;
      let p=`<div class="panel"><button class="panel-back" onclick="pickerStep='drink';render()">‹ Zurück</button>
        <div class="panel-title">${dr.emoji} ${dr.name}</div><div class="panel-sub">Größe wählen</div><div class="size-grid">`;
      dr.sizes.forEach(sz=>{p+=`<div class="size-btn" onclick="logDrink(ALL_DRINKS['${dr.id}'],{label:'${sz.label}',ml:${sz.ml},mg:${sz.mg}})"><span class="sz-name">${sz.label}</span><span class="sz-ml">${sz.ml}ml</span><span class="sz-mg">${sz.mg}mg</span></div>`});
      p+=`</div></div>`;ov.innerHTML=p
    }
    document.body.appendChild(ov)
  }

  // Edit modal
  let em=document.getElementById("em");if(em)em.remove();
  if(editingEntry){
    const{dk:d,eid,hh,mm}=editingEntry;const e=(log[d]||[]).find(x=>x.id===eid);const dr=e?ALL_DRINKS[e.drinkId]:null;
    const m=document.createElement("div");m.id="em";m.className="modal";
    m.onclick=ev=>{if(ev.target===m){editingEntry=null;render()}};
    m.innerHTML=`<div class="modal-box"><h3>${dr?.emoji||"☕"} Uhrzeit korrigieren</h3>
      <div class="modal-time"><input type="number" id="eh" min="0" max="23" value="${hh}" inputmode="numeric"><span>:</span><input type="number" id="em2" min="0" max="59" value="${mm}" inputmode="numeric"></div>
      <div class="modal-btns"><button class="modal-btn btn-cancel" onclick="editingEntry=null;render()">Abbrechen</button><button class="modal-btn btn-save" onclick="editingEntry.hh=document.getElementById('eh').value;editingEntry.mm=document.getElementById('em2').value;saveEdit()">OK</button></div></div>`;
    document.body.appendChild(m)
  }
}

load();render();fetchSleep();setInterval(render,6e4);
// Refresh sleep data every 30 min
setInterval(fetchSleep,18e5);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
